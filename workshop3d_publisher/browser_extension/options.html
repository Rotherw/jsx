<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkShop3D — parowanie Chrome</title>
  <style>
    body { font: 15px/1.45 "Segoe UI", sans-serif; margin: 0; background: #14141a; color: #eee; }
    main { max-width: 620px; margin: 32px auto; background: #1e1e28; border: 1px solid #333341; border-radius: 12px; padding: 24px; }
    h1 { margin-top: 0; font-size: 22px; }
    label { display: block; margin: 16px 0 5px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #444455; border-radius: 7px; background: #111116; color: #fff; }
    button { margin-top: 18px; padding: 10px 16px; border: 0; border-radius: 7px; background: #1f8a44; color: white; font-weight: 650; cursor: pointer; }
    #test { background: #345c89; margin-left: 8px; }
    #status { margin-top: 16px; padding: 10px; border-radius: 7px; background: #292936; }
    .ok { color: #79e39c; } .bad { color: #ff8b8b; }
    small { color: #a5a5b2; }
  </style>
</head>
<body>
  <main>
    <h1>Sparuj Chrome z WorkShop3D</h1>
    <p>Rozszerzenie korzysta z kart i logowań zapisanych w tym Chrome. Nie odczytuje ani nie wysyła haseł i ciasteczek do panelu.</p>
    <label for="server">Adres lokalnego panelu</label>
    <input id="server" value="http://127.0.0.1:5000" spellcheck="false">
    <label for="key">Kod parowania z panelu WorkShop3D</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false">
    <small>Kod znajdziesz w panelu: Ustawienia → Sparowany Chrome.</small>
    <div>
      <button id="save" type="button">Zapisz</button>
      <button id="test" type="button">Sprawdź połączenie</button>
    </div>
    <div id="status">Nie sprawdzono połączenia.</div>
  </main>
  <script src="options.js"></script>
</body>
</html>

<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>WorkShop3D Publisher Panel</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; background: #f7f7f7; }
      .top { display: flex; gap: 10px; margin-bottom: 12px; }
      .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
      .status { font-weight: bold; }
      .thumb { width: 110px; height: 110px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
      .row { display: flex; gap: 12px; }
      .meta { flex: 1; }
      .actions button { margin-right: 8px; margin-top: 6px; }
      pre { white-space: pre-wrap; background: #111; color: #0f0; padding: 8px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="top">
      <button id="refresh">Odśwież</button>
      <button id="publishAll">PUBLIKUJ WSZYSTKIE</button>
      <button id="diagnose">DIAGNOZUJ STRONĘ</button>
    </div>
    <div id="list"></div>
    <script src="panel.js"></script>
  </body>
</html>

# =====================================================================
# WorkShop3D Auto Publisher - configuration
# ---------------------------------------------------------------------
# Copy this file to  config/config.yaml  and edit it.
# config/config.yaml is git-ignored and NEVER committed.
#
# NO passwords / tokens / API keys go here. Secrets live in environment
# variables or the OS credential store (see README, section "Secrets").
# =====================================================================

# ---- Folders --------------------------------------------------------
paths:
  # The drop folder: this is the whole daily workflow. Drop one finished
  # product folder here and touch nothing else. A relative path is resolved
  # against the installation directory, so by default it is
  # <install>/Gotowe do sklepu, with the sibling <install>/Opublikowane
  # receiving the product after a full run.
  # Google Drive for desktop is NOT required (see cloud_sync below); when it is
  # running, its FolderSync/Gotowe do sklepu is watched as well.
  ready_folder: "Gotowe do sklepu"
  # Working directory for copies, packages, reports (originals stay untouched).
  work_folder: "work"

# ---- Run modes ------------------------------------------------------
modes:
  # Daily mode: drop a product folder and the rest happens automatically.
  zero_touch: true
  dry_run: false
  auto_publish: true
  # No per-product confirmation in zero-touch mode.
  require_approval: false

# ---- Paired Chrome -------------------------------------------------
# The included extension runs in your normal Chrome and therefore reuses the
# tabs and logged-in sessions already present there. Passwords/cookies stay in
# Chrome. The installer writes the local pairing automatically; no code is
# copied or typed by the user.
browser:
  server_url: "http://127.0.0.1:5000"
  # After the one-time Chrome pairing, also click the final store button.
  auto_submit: true

# Honest store declarations. Set true only when the delivered model or its
# marketing artwork was made with generative AI.
content:
  made_with_ai: false

# ---- Lore source ----------------------------------------------------
# Exact/near-exact folder-name matches are enriched from the public KF2 wiki.
# Ambiguous names are deliberately ignored, and a wiki outage never blocks a job.
wiki:
  enabled: true
  base_url: "https://wiki.kf2.pl"
  locale: "pl"
  timeout_seconds: 8
  minimum_match_score: 0.78

# ---- Cloud sync -------------------------------------------------------
# Daily use: drop one finished product folder into the drop folder above. The
# same folder structure is pushed to Nextcloud Folder Sync/Gotowe do sklepu. No
# extra product copy or manifest is created. After the full run the folder moves
# to the sibling Opublikowane on both sides. Deletions are never propagated.
#
# The working area is Google Drive for desktop when that client is running;
# otherwise it is the drop folder above and its sibling Opublikowane. Nothing
# waits for a desktop client that is not installed - mirroring a whole model
# library locally is not a requirement for publishing.
cloud_sync:
  enabled: true
  inbox_folder: "Gotowe do sklepu"
  published_folder: "Opublikowane"
  retry_seconds: [60, 300, 900, 3600]
  mirror_enabled: true
  # google_to_nextcloud (default) = one-way push. Google Folder Sync is the
  #   working area and the source of truth; Nextcloud Folder Sync is the
  #   post-sale archive. A file that exists only on Nextcloud is left alone,
  #   so clearing a published product out of the working area stays cleared.
  # two_way = older behaviour; edits also travel Nextcloud -> Google and the
  #   newer file wins. Note this also means the archive restores anything you
  #   delete from the working area.
  mirror_direction: "google_to_nextcloud"
  # Which top-level folders under Folder Sync the mirror keeps on Nextcloud.
  # Leave unset to use the direction default: one-way mirrors only
  # "Opublikowane", so work in progress stays on Google and the archive holds
  # published products only. The package still reaches Nextcloud during the run
  # (sync_product) and is moved to Opublikowane by archive_product; the mirror
  # simply stops re-creating the inbox there afterwards.
  # two_way mirrors both folders.
  # mirror_folders: ["Opublikowane"]
  mirror_interval_seconds: 15
  # Existing folders in Google are also copied/published on first run.
  process_existing_inbox: true
  google_drive:
    # false (our setting) = never use Google Drive for desktop, even if it is
    #   installed. Mirroring the whole model library onto the working disk
    #   cripples the machine, so the local drop folder is the working area.
    # true = use the desktop client, but only when it is actually present; when
    #   it is not, the local drop folder takes over and nothing stalls.
    enabled: false
    folder_id: "1bKkH3_P2XYCtFtSv4HlzmWE16cqjYGlo"
    folder_name: "Folder Sync"
    local_folder: ""           # blank = auto-detect Google Drive for desktop
  nextcloud:
    server_url: "https://cloud.workshop3d.pl"
    folder_path: "Folder Sync"
    # Always use the actual web cloud, never an unrelated empty local folder.
    prefer_webdav: true
    auto_connect: true
    local_folder: ""
    username_env: "NEXTCLOUD_USERNAME"
    password_env: "NEXTCLOUD_APP_PASSWORD"

# ---- Trigger / stability -------------------------------------------
trigger:
  # Seconds of no changes in a product folder before processing starts.
  stability_delay_seconds: 60
  # File-size must be identical across this many checks to count as "done copying".
  stability_checks: 3
  seconds_between_checks: 5
  # Temp / partial files to ignore.
  ignore_patterns:
    - "*.tmp"
    - "*.crdownload"
    - "*.part"
    - "~$*"
    - ".DS_Store"
    - "Thumbs.db"

# ---- Retry ----------------------------------------------------------
retry:
  max_attempts: 3
  backoff_seconds: [2, 4, 8]

# ---- Brand ----------------------------------------------------------
brand:
  name: "WorkShop3D"
  # false = your PNGs are used as-is (you brand them with your own tool);
  # true  = the program composes covers/thumbnails with title + brand text.
  render_graphics: true
  # WorkShop3D is the maker; KF2.pl is shown separately as patron.
  logo_path: "assets/brand/workshop3d_logo.png"
  patron_name: "KF2.pl"
  patron_logo_path: "assets/brand/kf2_logo.png"
  font_path: "assets/fonts/UncialAntiqua-Regular.ttf"
  signature: |
    Regards.
    Rafal z WorkShop3D
  # Collections. Detection is by folder-name keywords / explicit rules only.
  # A product is NEVER auto-tagged into a collection it doesn't match.
  collections:
    - id: "kroniki_fallathanu"
      display_name: "Kroniki Fallathanu"
      match_keywords: ["fallathan", "kroniki fallathanu"]
      tags: ["kroniki fallathanu", "dark fantasy"]
    - id: "kufel_i_kosci"
      display_name: "Kufel i Kosci"
      match_keywords: ["kufel i kosci", "kufel", "tavern"]
      tags: ["tavern", "dnd"]
    - id: "rpg_fans"
      display_name: "RPG Fans"
      match_keywords: ["rpg fans"]
      tags: ["rpg"]
    - id: "rpg_city"
      display_name: "rpg.city"
      match_keywords: ["rpg.city", "rpg city"]
      tags: ["rpg"]

# ---- Pricing (rules, never hard-coded in source) --------------------
pricing:
  currency: "USD"
  single_model: 4.99
  bundle_small: 13.99          # ~3 models
  free_products: false

# ---- Licensing (per platform; default = no redistribution) ----------
licensing:
  default:
    redistribution_allowed: false
    physical_sales_allowed: false
    owner: "WorkShop3D"
    summary: >
      Digital files may not be redistributed. All rights to the model and
      materials remain with WorkShop3D unless another owner is stated.
  per_platform: {}             # e.g. cults3d: { physical_sales_allowed: true }

# ---- Categories -----------------------------------------------------
categories:
  default: "miniature"
  # keyword -> category, checked against folder name (first match wins)
  keyword_map:
    terrain: "terrain"
    building: "terrain"
    door: "terrain"
    dungeon: "terrain"
    diorama: "diorama"
    bundle: "bundle"
    prop: "prop"
    npc: "miniature"
    miniature: "miniature"

# ---- Asset hosts (public URLs for stores that don't accept uploads) -
# Cults3D references files by public HTTPS URL. The Google Drive host uploads
# the product's images + package ZIP into a folder on your Drive, marks them
# public, and returns Cults-compatible direct links.
asset_hosts:
  google_drive:
    # Optional technical folder used only by Cults3D API mode. It stays
    # separate from the private FolderSync/Gotowe do sklepu workflow.
    root_folder_name: "WorkShop3D Public Assets"
    # Path to a Google service-account JSON key is read from this env var.
    # Share the FolderSync folder with the service account's e-mail address.
    credentials_env: "GOOGLE_APPLICATION_CREDENTIALS"
    url_template: "usercontent"           # "usercontent" (robust) | "uc"
  static:
    base_url: ""                          # e.g. "https://yoursite.com/w3d"

# ---- Stores (independent adapters) ----------------------------------
stores:
  cults3d:
    enabled: true
    mode: "browser"            # "browser" (normal logged-in Chrome) | "api"
    publish_as: "public"       # "draft" | "public"
    locale: "EN"               # listing locale sent to Cults3D
    license_code: ""           # your Cults licence code (leave "" to omit)
    category_id: ""            # optional: force a Cults category id
    price_in_cents: false      # true if your Cults account expects price in cents
    max_tags: 20
    max_files: 10
    # Cults3D references files by PUBLIC HTTPS URL (no upload).
    asset_host: "google_drive" # "google_drive" | "static"
    file_selection: "zip"      # "zip" (host the package ZIP) | "all" (each model file)
    # Used only when asset_host: "static" (you mirror the work folder yourself):
    asset_base_url: ""
  thangs:
    enabled: true
    mode: "browser"            # "browser" | "sync" (official desktop tool)
    publish_as: "public"
    # Folder watched by the Thangs Sync desktop app. The adapter stages each
    # product as a subfolder here + writes thangs_bulk_upload.csv; you then open
    # Thangs Sync (logged in) and press Start Upload. Leave "" -> NOT_CONNECTED.
    sync_folder: ""            # e.g. "C:/Users/Rafal/WorkShop3D/ThangsSync"
    max_tags: 20
    secondary_category: ""
    category_map: {}           # optional: our category -> Thangs category name
  creality_cloud_eu:
    enabled: true
    mode: "browser"            # "browser" | "batch" (official desktop tool)
    publish_as: "public"
    # Folder you point the Creality Cloud Batch Upload Tool at. The adapter
    # stages each product as a subfolder + creality_upload_info.txt; you open
    # the tool (logged in) and upload. Leave "" -> NOT_CONNECTED.
    staging_folder: ""         # e.g. "C:/Users/Rafal/WorkShop3D/CrealityEU"
  creality_cloud_cn:
    enabled: true
    mode: "browser"
    publish_as: "public"
    staging_folder: ""         # e.g. "C:/Users/Rafal/WorkShop3D/CrealityCN"

# ---- Social media (independent adapters) ----------------------------
social:
  # Handles tagged in every promo post, based on where the product went live.
  # Tagging the destination store's account helps the post's reach.
  store_handles:
    cults3d: "@cults3d"
    thangs: "@thangs3d"
    creality_cloud_eu: "@CrealityCloud"
    creality_cloud_cn: "@CrealityCloud"
  facebook:
    enabled: true
    mode: "browser"
    language: "pl"
  instagram:
    enabled: true
    mode: "browser"
    language: "en"
    link_in_bio: true
  x:                         # X / Twitter (needs a developer app)
    enabled: true
    mode: "browser"
  pinterest:                 # needs a developer app + board id
    enabled: true
    mode: "browser"
  mastodon:                  # fully wired (token auth)
    enabled: true
    mode: "browser"
  bluesky:                   # fully wired (app password)
    enabled: true
    mode: "browser"
  tiktok:
    enabled: true
    mode: "browser"
    photo_mode: true
  youtube:
    enabled: true
    mode: "browser"
    community_post: true
  # Never post to local city groups / private profiles unless enabled here.
  extra_targets: []

# ---- Link card ------------------------------------------------------
links:
  # Which store URL becomes the "main" product link (priority order).
  main_link_priority:
    - cults3d
    - thangs
    - creality_cloud_eu
    - creality_cloud_cn
